name: Tracker state keeper
on:
  schedule:
    - cron: "17 6 * * 1,4"   # Mondays and Thursdays — keeps the store alive and backed up
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Back up live state or recreate the store from backup
        run: |
          store=$(python3 -c "import json; print(json.load(open('site/config.json'))['store'])" 2>/dev/null || true)
          if [ -z "$store" ]; then
            echo "no store configured yet — nothing to do"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if curl -sf "$store" -o /tmp/live.json && python3 -m json.tool /tmp/live.json > /dev/null 2>&1; then
            if ! cmp -s /tmp/live.json site/state.json; then
              cp /tmp/live.json site/state.json
              git add site/state.json
              git commit -m "Back up live tracker state"
              git push
            else
              echo "backup already current"
            fi
          else
            echo "store unreachable — recreating from the last backup"
            loc=$(curl -sf -D - -o /dev/null -X POST \
              -H 'Content-Type: application/json' \
              --data-binary @site/state.json \
              https://jsonblob.com/api/jsonBlob | tr -d '\r' | awk 'tolower($1)=="location:"{print $2}')
            if [ -z "$loc" ]; then
              echo "::error::could not recreate the shared state store"
              exit 1
            fi
            case "$loc" in
              http*) : ;;
              *) loc="https://jsonblob.com$loc" ;;
            esac
            printf '{"store":"%s"}\n' "$loc" > site/config.json
            git add site/config.json
            git commit -m "Recreate tracker state store from backup"
            git push
          fi
